<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>로그인 · 2급자격과정 강사행정</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="narrow" style="padding-top:60px;">
  <div class="card">
    <div class="card-head" style="border-bottom:none; padding-bottom:0; margin-bottom:18px;">
      <div>
        <span class="eyebrow">로그인</span>
        <h1>2급자격과정 강사행정</h1>
        <p>강사 · 운영자 계정으로 로그인하세요.</p>
      </div>
    </div>

    <div id="msg" class="msg"></div>

    <form id="login-form">
      <div class="field-grid single">
        <div class="field">
          <label>이메일</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label>비밀번호</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn primary" id="login-btn">로그인</button>
        <button type="button" class="btn ghost" id="forgot-toggle">비밀번호를 잊으셨나요?</button>
      </div>
    </form>

    <form id="forgot-form" style="display:none; margin-top:26px; padding-top:22px; border-top:1px solid var(--line);">
      <div class="field-grid single">
        <div class="field">
          <label>재설정 링크를 받을 이메일</label>
          <input type="email" id="forgot-email" required />
        </div>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn primary">재설정 링크 보내기</button>
        <button type="button" class="btn ghost" id="forgot-cancel">취소</button>
      </div>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
(async function(){
  const existing = await getSessionUser();
  if (existing) { window.location.href = "admin.html"; return; }

  const msg = document.getElementById("msg");
  const loginForm = document.getElementById("login-form");
  const loginBtn = document.getElementById("login-btn");
  const forgotForm = document.getElementById("forgot-form");
  const forgotToggle = document.getElementById("forgot-toggle");
  const forgotCancel = document.getElementById("forgot-cancel");

  forgotToggle.addEventListener("click", () => {
    loginForm.style.display = "none";
    forgotForm.style.display = "block";
    hideMsg(msg);
  });
  forgotCancel.addEventListener("click", () => {
    forgotForm.style.display = "none";
    loginForm.style.display = "block";
    hideMsg(msg);
  });

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg(msg);
    loginBtn.disabled = true;
    loginBtn.textContent = "로그인 중...";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    loginBtn.disabled = false;
    loginBtn.textContent = "로그인";
    if (error) {
      showMsg(msg, "로그인 실패: 이메일 또는 비밀번호를 확인해주세요.", "error");
      return;
    }
    window.location.href = "admin.html";
  });

  forgotForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg(msg);
    const email = document.getElementById("forgot-email").value.trim();
    const { error } = await sb.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + "/reset-password.html",
    });
    if (error) {
      showMsg(msg, "재설정 링크 발송에 실패했습니다: " + error.message, "error");
      return;
    }
    showMsg(msg, "입력하신 이메일로 재설정 링크를 보냈습니다. 메일함을 확인해주세요.", "success");
    forgotForm.style.display = "none";
    loginForm.style.display = "block";
  });
})();
</script>
</body>
</html>
