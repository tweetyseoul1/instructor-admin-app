<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>수료증·자격증 신청서 · 2급자격과정 강사행정</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="site">
  <div class="site-inner">
    <div class="wordmark">
      <span class="name">2급자격과정 강사행정</span>
      <span class="tag">수료증·자격증 신청</span>
    </div>
  </div>
</header>

<main>
  <div class="card">
    <div class="card-head">
      <div>
        <span class="eyebrow">서식 제2호</span>
        <h1>수료증·자격증 신청서</h1>
        <p>강의 종료 후 수강생이 수료증 또는 1·2급 자격증 발급을 신청하기 위한 서식입니다. 로그인 없이 제출하실 수 있습니다.</p>
      </div>
    </div>

    <div id="msg" class="msg"></div>

    <form id="cert-form">
      <div class="section-label"><span class="bar"></span><span>1. 신청자(수강생) 정보</span></div>
      <div class="field-grid">
        <div class="field"><label>성명<span class="req">*</span></label><input id="f-name" type="text" required></div>
        <div class="field"><label>생년월일</label><input id="f-dob" type="date"></div>
        <div class="field"><label>연락처<span class="req">*</span></label><input id="f-phone" type="tel" placeholder="010-0000-0000" required></div>
        <div class="field"><label>이메일</label><input id="f-email" type="email"></div>
        <div class="field span2"><label>주소</label><input id="f-address" type="text"></div>
      </div>

      <div class="section-label"><span class="bar"></span><span>2. 교육과정 정보</span></div>
      <div class="field-grid">
        <div class="field span2"><label>과정명</label><input id="f-course" type="text"></div>
        <div class="field"><label>수료일자</label><input id="f-complete" type="date"></div>
        <div class="field"><label>총 교육시간(시간)</label><input id="f-hours" type="number" min="0"></div>
      </div>

      <div class="section-label"><span class="bar"></span><span>3. 신청 정보</span></div>
      <div class="field-grid">
        <div class="field">
          <label>신청종류<span class="req">*</span></label>
          <select id="f-request-type" required>
            <option value="" disabled selected>선택하세요</option>
            <option value="수료증">수료증 신청</option>
            <option value="1급 자격증">1급 자격증 신청</option>
            <option value="2급 자격증">2급 자격증 신청</option>
          </select>
        </div>
        <div class="field">
          <label>신청구분<span class="req">*</span></label>
          <select id="f-type" required>
            <option value="" disabled selected>선택하세요</option>
            <option value="신규">신규</option>
            <option value="재발급">재발급</option>
          </select>
        </div>
        <div class="field span2">
          <label>담당 강사(어느 강사에게 수업을 받으셨나요?)<span class="req">*</span></label>
          <select id="f-instructor" required><option value="" disabled selected>선택하세요</option></select>
        </div>
        <div class="field" id="payment-date-wrap" style="display:none;">
          <label>자격증비 입금일자</label>
          <input id="f-payment-date" type="date">
          <span class="hint">1·2급 자격증 신청 시에만 입력합니다.</span>
        </div>
      </div>

      <div class="sign-row">
        <div class="field"><label>신청일자</label><input id="f-apply-date" type="date" required></div>
        <div class="field"><label>신청인(성명)</label><input id="f-applicant" type="text" required></div>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn primary" id="submit-btn">신청서 제출</button>
      </div>
    </form>
  </div>
</main>

<footer class="site">2급자격과정 강사행정 시스템</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script>
(async function(){
  const msg = document.getElementById("msg");
  function showMsg(el, text, kind){ el.textContent = text; el.className = "msg show " + (kind || "error"); }
  function hideMsg(el){ el.className = "msg"; }

  document.getElementById("f-apply-date").value = new Date().toISOString().slice(0, 10);

  const requestTypeSelect = document.getElementById("f-request-type");
  const paymentDateWrap = document.getElementById("payment-date-wrap");
  requestTypeSelect.addEventListener("change", () => {
    const isCert = requestTypeSelect.value === "1급 자격증" || requestTypeSelect.value === "2급 자격증";
    paymentDateWrap.style.display = isCert ? "" : "none";
    if (!isCert) document.getElementById("f-payment-date").value = "";
  });

  const instructorSelect = document.getElementById("f-instructor");
  const { data: instructors } = await sb.from("instructor_directory").select("id, name").order("name");
  (instructors || []).forEach(i => {
    const opt = document.createElement("option");
    opt.value = i.id; opt.textContent = i.name;
    instructorSelect.appendChild(opt);
  });

  document.getElementById("cert-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg(msg);
    const submitBtn = document.getElementById("submit-btn");
    submitBtn.disabled = true;
    submitBtn.textContent = "제출 중...";

    const row = {
      student_name: document.getElementById("f-name").value.trim(),
      student_dob: document.getElementById("f-dob").value || null,
      student_phone: document.getElementById("f-phone").value.trim(),
      student_email: document.getElementById("f-email").value.trim() || null,
      student_address: document.getElementById("f-address").value.trim() || null,
      course_name: document.getElementById("f-course").value.trim() || null,
      completion_date: document.getElementById("f-complete").value || null,
      total_hours: document.getElementById("f-hours").value || null,
      request_type: document.getElementById("f-request-type").value,
      application_type: document.getElementById("f-type").value,
      instructor_id: document.getElementById("f-instructor").value,
      payment_date: document.getElementById("f-payment-date").value || null,
      application_date: document.getElementById("f-apply-date").value,
      applicant_name: document.getElementById("f-applicant").value.trim(),
    };

    const { error } = await sb.from("certificate_requests").insert(row);
    submitBtn.disabled = false;
    submitBtn.textContent = "신청서 제출";
    if (error) {
      showMsg(msg, "제출 실패: " + error.message, "error");
      return;
    }
    showMsg(msg, "신청이 접수되었습니다. 담당 강사 확인 후 처리됩니다.", "success");
    document.getElementById("cert-form").reset();
    document.getElementById("f-apply-date").value = new Date().toISOString().slice(0, 10);
    paymentDateWrap.style.display = "none";
  });
})();
</script>
</body>
</html>
