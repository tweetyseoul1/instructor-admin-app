<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>비밀번호 재설정 · 2급자격과정 강사행정</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="narrow" style="padding-top:60px;">
  <div class="card">
    <div class="card-head" style="border-bottom:none; padding-bottom:0; margin-bottom:18px;">
      <div>
        <span class="eyebrow">비밀번호 재설정</span>
        <h1>새 비밀번호 설정</h1>
        <p>이메일로 받은 링크를 통해 접속하셨습니다. 새 비밀번호를 입력해주세요.</p>
      </div>
    </div>

    <div id="msg" class="msg"></div>

    <form id="reset-form">
      <div class="field-grid single">
        <div class="field">
          <label>새 비밀번호 (6자 이상)</label>
          <input type="password" id="password" minlength="6" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label>새 비밀번호 확인</label>
          <input type="password" id="password2" minlength="6" required autocomplete="new-password" />
        </div>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn primary" id="reset-btn">비밀번호 변경</button>
      </div>
    </form>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script>
(function(){
  const msg = document.getElementById("msg");
  const form = document.getElementById("reset-form");
  const btn = document.getElementById("reset-btn");
  let recoveryReady = false;

  sb.auth.onAuthStateChange((event) => {
    if (event === "PASSWORD_RECOVERY") recoveryReady = true;
  });

  // If the recovery session is already present by the time this script runs.
  sb.auth.getSession().then(({ data }) => {
    if (data.session) recoveryReady = true;
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideMsg(msg);
    const p1 = document.getElementById("password").value;
    const p2 = document.getElementById("password2").value;
    if (p1 !== p2) {
      showMsg(msg, "두 비밀번호가 일치하지 않습니다.", "error");
      return;
    }
    if (!recoveryReady) {
      showMsg(msg, "재설정 링크가 유효하지 않거나 만료되었습니다. 로그인 화면에서 다시 요청해주세요.", "error");
      return;
    }
    btn.disabled = true;
    btn.textContent = "변경 중...";
    const { error } = await sb.auth.updateUser({ password: p1 });
    btn.disabled = false;
    btn.textContent = "비밀번호 변경";
    if (error) {
      showMsg(msg, "변경 실패: " + error.message, "error");
      return;
    }
    showMsg(msg, "비밀번호가 변경되었습니다. 잠시 후 로그인 화면으로 이동합니다.", "success");
    await sb.auth.signOut();
    setTimeout(() => { window.location.href = "login.html"; }, 1800);
  });
})();
</script>
</body>
</html>
